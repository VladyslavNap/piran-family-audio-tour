<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e5a6e">
  <meta name="description" content="Сімейна аудіоекскурсія Піраном «Володарі солі» — карта, GPS і 10 зупинок.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Володарі солі">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Володарі солі — сімейна аудіоекскурсія Піраном</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="top-bar" role="banner">
      <div class="top-bar__text">
        <h1 class="top-bar__title">Володарі солі</h1>
        <p class="top-bar__subtitle">сімейна аудіоекскурсія Піраном</p>
      </div>
    </header>

    <div id="map" role="application" aria-label="Карта маршруту"></div>

    <div id="unlock-banner" class="unlock-banner" hidden>
      <button type="button" id="unlock-btn" class="unlock-btn">
        Увімкнути звук і геолокацію
      </button>
      <p class="unlock-hint">Потрібен один дотик, щоб браузер дозволив аудіо та GPS.</p>
    </div>

    <aside id="sheet" class="sheet" aria-label="Панель зупинок">
      <div class="sheet__handle" aria-hidden="true"></div>
      <div class="now-playing">
        <div class="now-playing__meta">
          <span id="now-order" class="now-playing__order">—</span>
          <div>
            <p id="now-name" class="now-playing__name">Оберіть зупинку</p>
            <p id="now-status" class="now-playing__status">Очікування геолокації…</p>
          </div>
        </div>
        <div class="now-playing__controls">
          <button type="button" id="play-btn" class="play-btn" aria-label="Відтворити" disabled>
            <span class="play-btn__icon" aria-hidden="true">▶</span>
          </button>
        </div>
      </div>
      <div class="progress-wrap">
        <input type="range" id="progress" class="progress" min="0" max="100" value="0" step="0.1" aria-label="Прогрес аудіо" disabled>
        <div class="progress-times">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>
      <h2 class="stops-heading">Зупинки</h2>
      <ol id="stops-list" class="stops-list"></ol>
    </aside>
  </div>

  <audio id="player" preload="metadata" playsinline></audio>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/geo.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
